log_format sabun '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time requestId=$request_id';
server {
    access_log /var/log/nginx/access.log sabun;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 52m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
